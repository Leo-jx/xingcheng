    <path d="M27 126 C50 120 68 132 92 128 C116 124 134 134 173 126"/>
  </g>
  <!-- 橘子洲 -->
  <path d="M70 136 Q100 130 130 136 Q100 142 70 136 Z" fill="none" stroke="#E3BE72" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- 亭阁飞檐 -->
  <g fill="none" stroke="#E3BE72" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="100" cy="146" r="2"/>
    <path d="M100 148 V150"/>
    <path d="M66 152 C72 158 78 160 86 160 C92 160 96 150 100 150 C104 150 108 160 114 160 C122 160 128 158 134 152"/>
    <path d="M78 167 C86 167 90 171 100 171 C110 171 114 167 122 167"/>
    <path d="M87 171 V178 M113 171 V178 M81 178 H119"/>
