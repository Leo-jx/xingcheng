<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="星城风物志 · 长沙文旅标识">
  <title>星城风物志 · 长沙文旅标识（方形徽标）</title>
  <defs>
    <linearGradient id="csRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C3272B"/>
      <stop offset="1" stop-color="#8E1C1C"/>
    </linearGradient>
  </defs>

  <!-- 印章底 -->
  <rect x="4" y="4" width="192" height="192" rx="36" fill="url(#csRed)"/>
  <!-- 双金框 -->
  <rect x="10" y="10" width="180" height="180" rx="31" fill="none" stroke="#E3BE72" stroke-width="1.7"/>
  <rect x="15.5" y="15.5" width="169" height="169" rx="26" fill="none" stroke="#E3BE72" stroke-opacity=".42" stroke-width=".8"/>
  <!-- 四角点 -->
  <g fill="#E3BE72" opacity=".8">
    <circle cx="27" cy="27" r="1.5"/><circle cx="173" cy="27" r="1.5"/>
    <circle cx="27" cy="173" r="1.5"/><circle cx="173" cy="173" r="1.5"/>
  </g>

  <g fill="none" stroke="#E3BE72" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- 星：星城 -->
    <path d="M100 30 L104.5 41.9 L117.1 42.4 L107.2 50.4 L110.6 62.6 L100 55.6 L89.4 62.6 L92.8 50.4 L82.9 42.4 L95.5 41.9 Z"/>
